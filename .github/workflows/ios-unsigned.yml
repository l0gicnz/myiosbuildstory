name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-15-intel
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Flutter dependencies
        run: flutter pub get

      - name: Restore missing iOS scaffolding
        run: flutter create --platforms=ios .

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Payload build/ios/unsigned
          mkdir -p Payload build/ios/unsigned
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload build/ios/unsigned/powerline_measure.ipa

      - name: Upload unsigned IPA as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-build-${GITHUB_RUN_NUMBER}" \
            build/ios/unsigned/powerline_measure.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "iOS build ${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned IPA for personal Sideloadly testing."
